[project]
name = "sca2"
version = "2.0"
description = "AI experiments"
readme = "README.md"
# The floor names a patch version on purpose: uv discards prerelease information from
# a `requires-python` bound inside the same minor series, so `>=3.14` and `>=3.14.0` are
# both satisfied by a 3.14.0 release candidate, as is `.python-version` holding `3.14`.
# A container with an rc in its uv cache then builds the venv on it and never fetches
# the final release — which surfaces as a wall of tracebacks from whatever dependency
# calls a stdlib signature the rc lacked (pydantic and `typing._eval_type`, 2026-09-11),
# reading as a code problem rather than an interpreter one. `.1` is the one bound that
# truncation can't reach. It costs us 3.14.0 final, excluded along with its prereleases.
requires-python = ">=3.14.1"
dependencies = [
    "cloudpickle>=3.1.2",
    "datasets>=3.0.0",  # Hugging Face Datasets
    "equinox>=0.13",  # neural networks as JAX pytrees
    "ftfy>=6.3.1",  # text cleaning for NLP tasks
    "huggingface-hub[hf-xet]>=1.19",
    "imageio-ffmpeg>=0.6.0",  # for video support in matplotlib
    "jax>=0.6",  # accelerated array computing and program transformation
    "jaxtyping>=0.2.38",
    "jinja2>=3.1.6",
    "markdown>=3.10",
    "matplotlib>=3.10.0",  # plotting and visualization
    "modal[api-proxy-support]>=1.5.1",  # remote (cloud) GPU compute; the extra (new in 1.5.1) lets its gRPC tunnel via HTTPS_PROXY (cloud sandboxes)
    "numpy>=2.2.3",  # numerical computing (multi-dimensional arrays)
    "optax>=0.2.4",  # gradient transformations and optimizers for JAX
    "pandas>=2.2.3",  # tabular data manipulation
    "pydantic>=2.13.4",  # data validation
    "pymdown-extensions>=10.21",
    "pyzmq>=27.1.0",
    "requests>=2.32.3",
    "rich>=14.3.2",  # pretty terminal output
    "scikit-learn>=1.6.1",
    "scipy>=1.15",  # quasi-Monte Carlo sampling (stats.qmc) for surveys; already present via scikit-learn
]

[project.scripts]
# Run and monitor memoized experiments: `mini run/ls/status/watch/...`.
# `bin/mini` wraps this so it works from any cwd without an activated venv.
mini = "mini.__main__:main"

[dependency-groups]
# Dependencies that aren't needed remotely (e.g. in Modal)
#
#     deps = mini.requirements.uv_freeze(all_groups=True, not_groups=['local', 'dev'])
#     image = modal.Image.debian_slim().pip_install(*deps)
#
dev = [
    "pandas-stubs",
    "pikepdf>=10.13.0.post1",
    "playwright>=1.62.0",
    "pypdfium2>=5.13.0",
    "pytest-asyncio>=0.25.3",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "pytest>=8.3.5",
    "ruff>=0.9.7",  # linter and formatter
    "scipy-stubs>=1.15.2.2",
    "segno>=1.6.1",  # QR code generation
    # Type checker. 0.0.84 fixes a use-after-free in incremental checking. Since
    # 0.0.82, a `list[list[str]]` mosaic no longer matches matplotlib's recursive
    # `HashableList` overloads, so the `plt.subplot_mosaic` calls in `docs/` cast
    # their mosaic to `mini.vis.Mosaic`. The casts can go once ty resolves those
    # overloads again.
    "ty>=0.0.84",
    "vulture>=2.14",  # dead code detection
]
local = [
]
# GPU support for remote (Modal) execution only. Locally we install plain
# (CPU) jax; the Modal image includes this group to get the CUDA plugin.
# Excluded from local installs by `uv sync --no-group cuda` (see install.sh).
cuda = [
    "jax[cuda12]>=0.6",
]

[tool.mini]
# Environment every task worker gets, on both backends. It has to be here rather
# than set from inside a task: a Modal container is reused across tasks, and XLA
# parses XLA_FLAGS once when its backend comes up, so an in-process setting takes
# effect for whichever task happened to run first and is ignored thereafter.
#
#   deterministic_ops       makes scatter deterministic, via the fast expander.
#                           Without it, embedding-gradient scatter-adds accumulate
#                           in whatever order the atomics land, so the same seed
#                           and code give a different model every run. Measured on
#                           an L4: three containers, three digests; with it, one.
#                           Costs about 1.7x on a d64-L4 cell (eng/determinism.md).
#   exclude_nondeterministic_ops  the broader guard, for ops the scatter expander
#                           doesn't cover. Free at our sizes.
#
# A role can override per-experiment with env= (merged key by key). Not a secret
# channel: these values are recorded on every task record. Tokens go in secrets=.
env = { XLA_FLAGS = "--xla_cpu_enable_concurrency_optimized_scheduler=false --xla_gpu_deterministic_ops=true --xla_gpu_exclude_nondeterministic_ops=true" }

# See .agents/skills/mi-ni/references/storage.md
store-bucket = "z0u/sca2-store"
publish-repo = "z0u/sca2-pub"

[tool.mini.profiles.dev]
store-bucket = "z0u/sca2-store-dev"
publish-repo = "z0u/sca2-pub-dev"
modal-environment = "dev"

[tool.uv]
# Dependency cooldown to mitigate risk of supply chain attacks.
# https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
exclude-newer = "3 days"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace = true

[tool.ty.rules]
# Flags an assignment whose value is *assignable* to the declared type but not a
# *subtype* of it, which in practice means one thing: an `Any` landed in a typed
# slot. `Any` is assignable to everything, so the ordinary `invalid-assignment`
# check waves it through and a wrong type can travel a long way before anything
# notices. Turning it on caught one of those on its first run (see the notes in
# `todo/eng/ty-unsound-assignment.md`).
unsound-assignment = "error"

[[tool.ty.overrides]]
# Reports annotate the first binding out of an untyped dict — `epochs: int =
# c["epochs"]` — and that annotation *is* the point: it is the author saying what
# shape the dict has, and every later cell reads it through that annotation
# (see the `style-py` skill). The rule reads the same line as an unsound
# assignment, so it argues with the house convention rather than finding bugs.
include = ["docs/**/*.py"]

[tool.ty.overrides.rules]
unsound-assignment = "ignore"

[[tool.ty.overrides]]
# Off here for a cost reason rather than a style one: the eleven findings under
# `src/sca/` sit in `equinox` boundaries on the training path, and mini keys a
# memoized task on the *source text* of every project helper it reaches. Editing
# them re-fingerprints ~76 experiment functions — every `train_one` in M2 — and a
# stale DONE record re-runs. The fix is written up and ready in
# `todo/eng/ty-unsound-assignment.md`; it wants a session with a re-run budget.
include = ["src/sca/**/*.py"]

[tool.ty.overrides.rules]
unsound-assignment = "ignore"

[tool.ruff]
line-length = 120
# Markdown is excluded because ruff 0.16 began formatting fenced code blocks in
# it. Our docs' blocks are illustrative fragments, not runnable code, and the
# formatter reads them as the latter: it collapsed the very method-chaining
# example that `style-py` exists to teach, because the one-liner fits in 120
# columns. Excluding restores 0.15's behavior — prose stays ours to shape.
extend-exclude = [".vulture-*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C", "D", "T"]
ignore = [
    "E501", "E731",
    "C408",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D200", "D202", "D203", "D204", "D205", "D211", "D212", "D213", "D400", "D401", "D413", "D415",
    "F722",
    "Q000",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"docs/**/*.py" = [
    "B018",  # a literate script displays a cell's last expression
]
"**/sca/**/*.py" = [
    "C416",
    "D203", "D205", "D400", "D401", "D415",
]
"tests/**/*.py" = [
    "D",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Setting this replaces pytest's default rather than extending it, and `.*` is the
# default entry that keeps it out of dotted directories — without it, agent worktrees
# under `.claude/worktrees/` get collected as a second copy of tests/.
norecursedirs = [".*", "node_modules", "tmp*", "scratch*"]
# Parallel by default (pytest-xdist) as a convenience, not a need: the suite runs
# in ~30s serially and ~15s across cores. Serial (`-n0`) is the baseline every test
# must pass under, and the one to use with --pdb.
markers = ["hf: talks to the real Hugging Face bucket (slow, network); deselected by default — opt in with `-m hf`"]
# The orchestration tests drive real worker subprocesses through the shipped
# `drive_and_watch`, which waits like production does — a wedged task would hang the
# suite rather than fail it. The cap is well above the slowest test (a few seconds).
timeout = 60
addopts = ["-n", "auto", "-m", "not hf"]

[tool.vulture]
exclude = [
    "*/__pycache__/*",
    "*/.venv/*",
    "*.egg-info/*"
]
ignore_decorators = [
    "@model_validator",
    "@pytest.fixture"
]
ignore_names = [
    "do_*",  # http.server dispatches do_GET, do_HEAD by method name
    "pytestmark",
    "__getattr__",  # PEP 562 module hook: the interpreter calls it, no caller to find
    "__dir__"  # ditto
]
# make_whitelist = true
min_confidence = 60
paths = [
    "src/",
    "tests/",
    "docs/",
    ".vulture-allowlist.py"
]
sort_by_size = true
