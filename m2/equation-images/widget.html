<title>Equations as images</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: compact chip controls that flow into rows, then one context as a stack of equations (a ? b = y), the
   query last and set apart. Panels show at their native size (--pw) and shrink on narrow screens. */
:root {
  --bg: #f7f8fa;
  --fg: #1d2330;
  --muted: #5d6677;
  --rule: #d5dae3;
  --chip: #e8ebf1;
  --accent: #2d5bd7;
  --accent-fg: #ffffff;
  --pw: 192px;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --fg: #e3e7ef; --muted: #98a1b2; --rule: #2c323d; --chip: #222833;
    --accent: #7ea2ff; --accent-fg: #0e1320; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --fg: #e3e7ef; --muted: #98a1b2; --rule: #2c323d; --chip: #222833;
  --accent: #7ea2ff; --accent-fg: #0e1320; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.group > .label { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; margin-right: 3px; }
.group button {
  font: inherit; font-size: 12.5px; line-height: 1.3; border: 0; border-radius: 999px; padding: 3px 9px;
  background: var(--chip); color: var(--fg); cursor: pointer;
}
.group.ops button { font-family: var(--font-mono); font-size: 12px; }
.group button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.group button.anchored { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent); margin-inline: 3px; }
.group button:disabled { opacity: 0.4; cursor: default; }
.group button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 560px) {
  .controls { gap: 5px; }
  .group { flex-basis: 100%; }
  .group > .label { flex: 0 0 7.4em; margin-right: 0; white-space: nowrap; }
}
.eqs { display: grid; gap: 8px; justify-self: start; width: fit-content; max-width: 100%; }
.eq {
  display: grid; align-items: center; gap: 4px; justify-content: start;
  grid-template-columns: minmax(0, var(--pw)) 1.6em minmax(0, var(--pw)) 1.6em minmax(0, var(--pw));
}
.eq .sym { text-align: center; font-family: var(--font-mono); font-size: 18px; color: var(--muted); }
.eq .stack { display: grid; gap: 6px; }
.eq figure { margin: 0; display: grid; gap: 2px; }
.eq figcaption { font-size: 12px; line-height: 16px; color: var(--muted); text-align: center; }
/* Under All three, a and b carry captions too and the symbols clear one, so the operands line up with the middle answer. */
.eq.compare .sym { padding-bottom: 18px; }
.eq img {
  display: block; width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated;
  outline: 1px solid var(--rule); outline-offset: -1px; background: var(--chip);
}
.query { border-top: 1px solid var(--rule); padding-top: 10px; }
.eqs.no-examples .query { border-top: 0; padding-top: 0; }
.caption { color: var(--muted); font-size: 13px; max-width: 65ch; margin: 0; }
.caption code { font-family: var(--font-mono); font-size: 12.5px; }
</style>

<div class="wrap" id="app">
  <div class="controls">
    <div class="group ops" id="op" role="group" aria-label="Hidden op"><span class="label">Hidden op</span></div>
    <div class="group" id="model" role="group" aria-label="Answer"><span class="label">Answer</span></div>
    <div class="group" id="b" role="group" aria-label="Second image"><span class="label">Image b</span></div>
    <div class="group" id="pick" role="group" aria-label="Model color"><span class="label">Model color</span></div>
    <div class="group" id="render" role="group" aria-label="Colors"><span class="label">Colors</span></div>
    <div class="group" id="walk" role="group" aria-label="Examples"><span class="label">Examples</span></div>
    <div class="group" id="show" role="group" aria-label="Show"><span class="label">Show</span></div>
  </div>
  <div class="eqs" id="eqs"></div>
  <p class="caption" id="caption"></p>
</div>

<script>
const BASE = document.documentElement.dataset.panels ?? "panels/";
const OPS = ["mix", "lighten", "darken", "difference", "hue-hsv", "sat-hsv", "value-hsv"];
const ANCHORED = "difference";
const EXAMPLES = [["hats", "huelight"], ["barn", "ramp"], ["bikes", "rafting"]];
const CHOICES = {
  op: OPS.map(o => [o, o]),
  model: [["clean", "Unedited"], ["edited", "Edited"], ["truth", "True"], ["all", "All three"]],
  b: [["ramp", "Gray ramp"], ["huelight", "Hue and lightness"]],
  pick: [["argmax", "Most likely (T = 0)"], ["sample", "Drawn (T = 1)"]],
  render: [["posterized", "Posterized"], ["dithered", "Dithered"]],
  walk: [["in-sync", "In step"], ["random", "Random pixels"]],
  show: [["examples", "Examples and query"], ["query", "Query only"]],
};
const state = { op: "difference", model: "clean", b: "ramp", pick: "argmax", render: "posterized", walk: "in-sync", show: "examples" };

const src = name => window.PANELS?.[name] ?? BASE + name + ".png";
function img(name, alt) {
  const el = document.createElement("img");
  el.src = src(name);
  el.alt = alt;
  return el;
}
function sym(s) { const el = document.createElement("span"); el.className = "sym"; el.textContent = s; return el; }
function fig(el, caption) {
  const f = document.createElement("figure");
  const c = document.createElement("figcaption");
  c.textContent = caption;
  f.append(el, c);
  return f;
}
function row(cells, extra) {
  const r = document.createElement("div");
  r.className = "eq" + (extra ? " " + extra : "");
  r.append(...cells);
  return r;
}

function answerName(model, s = state) {
  if (model === "truth") return `truth-${s.render}-${s.b}-${s.op}`;
  return `answer-${s.walk}-${s.render}-${s.b}-${s.op}-${model}-${s.pick}`;
}
const NAMES = { clean: "Unedited", edited: "Edited", truth: "True" };

// Every panel a state shows, so the panels one click away can be fetched ahead of the click.
function panelNames(s) {
  const names = [`operand-${s.render}-parrots`, `operand-${s.render}-${s.b}`];
  if (s.show === "examples")
    for (const [a, b] of EXAMPLES) names.push(`operand-${s.render}-${a}`, `operand-${s.render}-${b}`, `example-${s.render}-${a}-${b}-${s.op}`);
  for (const m of s.model === "all" ? ["clean", "edited", "truth"] : [s.model]) names.push(answerName(m, s));
  return names;
}
const fetched = new Map();
function prefetch(name) {
  if (fetched.has(name)) return;
  const el = new Image();
  el.src = src(name);
  fetched.set(name, el);  // held so the browser keeps the decoded image
}
function prefetchNeighbors() {
  for (const [k, opts] of Object.entries(CHOICES))
    for (const [value] of opts)
      if (value !== state[k]) panelNames({ ...state, [k]: value }).forEach(prefetch);
}
const idle = window.requestIdleCallback ?? (f => setTimeout(f, 200));

let shown = 0;
function render() {
  const s = state, box = document.getElementById("eqs");
  const rows = [];
  if (s.show === "examples")
    for (const [a, b] of EXAMPLES)
      rows.push(row([img(`operand-${s.render}-${a}`, a), sym("?"), img(`operand-${s.render}-${b}`, b), sym("="),
                     img(`example-${s.render}-${a}-${b}-${s.op}`, `${a} ${s.op} ${b}`)]));
  const qa = img(`operand-${s.render}-parrots`, "parrots"), qb = img(`operand-${s.render}-${s.b}`, s.b);
  let y, cls = "query";
  if (s.model === "all") {
    cls += " compare";
    y = document.createElement("div");
    y.className = "stack";
    y.append(...["clean", "edited", "truth"].map(m => fig(img(answerName(m), NAMES[m]), NAMES[m])));
  } else {
    y = img(answerName(s.model), NAMES[s.model]);
  }
  const all = s.model === "all";
  rows.push(row([all ? fig(qa, "a") : qa, sym("?"), all ? fig(qb, "b") : qb, sym("="), y], cls));
  // Keep the old panels up until the new ones are decoded (or a short wait passes), so a slow fetch shows the
  // previous picture rather than an empty box.
  const ticket = ++shown;
  const imgs = rows.flatMap(r => [...r.querySelectorAll("img")]);
  const ready = Promise.all(imgs.map(i => i.decode().catch(() => {})));
  Promise.race([ready, new Promise(r => setTimeout(r, 1500))]).then(() => {
    if (ticket !== shown) return;
    box.classList.toggle("no-examples", s.show !== "examples");
    box.replaceChildren(...rows);
    idle(prefetchNeighbors);
  });

  const who = {
    clean: "the unedited model", edited: "the model with the op's axis edited out", truth: "the true op",
    all: "the unedited model, the edited model and the true op",
  }[s.model];
  const pick = s.model === "truth" ? "" : (s.pick === "sample"
    ? ", with one color drawn from the model's answer at each pixel"
    : ", with the model's most likely color at each pixel");
  const walk = s.model === "truth" ? "" : (s.walk === "random"
    ? " Each pixel of the query is its own context, with three example pixels drawn at random from the three example pairs."
    : " Each pixel of the query is its own context, with the three examples taken at the same position in the example pairs.");
  const lead = s.show === "examples" ? `Three examples of <code>${s.op}</code>, then the query` : `The query under <code>${s.op}</code>`;
  document.getElementById("caption").innerHTML = `${lead}, answered by ${who}${pick}.${walk}`;

  for (const k of Object.keys(CHOICES))
    for (const btn of document.querySelectorAll(`#${k} button`)) btn.setAttribute("aria-pressed", String(btn.value === s[k]));
  for (const id of ["pick", "walk"])
    for (const btn of document.querySelectorAll(`#${id} button`)) btn.disabled = s.model === "truth";
}

for (const [k, opts] of Object.entries(CHOICES)) {
  const g = document.getElementById(k);
  for (const [value, label] of opts) {
    const btn = document.createElement("button");
    btn.type = "button"; btn.value = value; btn.textContent = label; btn.id = `${k}-${value}`;
    if (k === "op" && value === ANCHORED) { btn.classList.add("anchored"); btn.title = "The anchored op"; }
    btn.addEventListener("click", () => { state[k] = value; render(); });
    g.append(btn);
  }
}
render();
</script>
