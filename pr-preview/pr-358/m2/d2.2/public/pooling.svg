<svg
  width="479"
  height="388"
  viewBox="0 0 479 388"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  style="color-scheme: light dark; --cube-fill: light-dark(#fff, #222); --ink: light-dark(black, white); --label-fill: light-dark(#00000014, #ffffff29);"
>
  <!-- Revised from docs/m2/ex-2.1.9/public/pooling.svg for the D2.2 post: mellowmax over positions and slices, mean over the batch, labeled sequences shaded. -->
  <!-- cube-fill is different from the color cube fill to keep them visually distinct. It is also the halo color that separates crossing lines. -->
  <rect width="479" height="388" style="fill: light-dark(white, transparent)" />
  <!-- The cube and its labels shift right to center over the legend row. -->
  <g id="cube" transform="translate(40 0)">
    <path
      id="cube-silhouette"
      d="M69.0496 123.175V264.744L204.593 343L340.136 264.744V123.175L204.593 44.919L69.0496 123.175Z"
      stroke-width="2"
      style="stroke: var(--ink); fill: var(--cube-fill)"
    />
    <path
      id="cube-edges-in"
      d="M69.0496 123.175L204.481 201.495M204.593 343V201.56L204.481 201.495M340.136 123.175L204.481 201.495"
      stroke-width="1"
      style="stroke: var(--ink); opacity: 0.7"
    />
    <!-- The first sequence of the top line (top face and its end on the left face), and a short sequence further down the left face. -->
    <g id="labeled-sequences" stroke-width="1" style="stroke: var(--ink)">
      <path
        d="M103.141 249.5L68.5 229.5V264L103.141 284V249.5ZM164 213.637L68.5 158.5V124.018L205 45.2094L299.5 99.769L164 178V213.637Z"
        style="fill: var(--label-fill)"
      />
    </g>
    <g id="cube-subdivisions" opacity="0.33" stroke-width="0.5" style="stroke: var(--ink)">
      <path d="M69.3643 159.026L204.593 237.018" />
      <path d="M339.821 159.026L204.593 237.018" />
      <path d="M69.3643 123.175L204.593 201.167" />
      <path d="M205.222 45.1825L340.45 123.175" />
      <path d="M177.484 60.570L313.027 138.826" />
      <path d="M150.376 76.221L285.919 154.477" />
      <path d="M123.267 91.873L258.810 170.129" />
      <path d="M96.158 107.524L231.701 185.780" />
      <path d="M339.821 123.175L204.593 201.167" />
      <path d="M298.938 99.903L163.71 177.895" />
      <path d="M69.3643 194.248L204.593 272.241" />
      <path d="M339.821 194.248L204.593 272.241" />
      <path d="M69.3643 229.471L204.593 307.463" />
      <path d="M339.821 229.471L204.593 307.463" />
      <path d="M69.3643 264.693L204.593 342.685" />
      <path d="M339.821 264.693L204.593 342.685" />
      <path d="M204.593 201.167V342.685" />
      <path d="M339.821 123.175V264.693" />
      <path d="M313.027 138.826V280.395" />
      <path d="M285.919 154.477V296.046" />
      <path d="M258.810 170.129V311.698" />
      <path d="M231.701 185.780V327.349" />
      <path d="M163.71 177.895V213.747" />
      <path d="M103.329 177.895V213.747" />
      <path d="M163.71 248.34V284.191" />
      <path d="M103.329 248.34V284.191" />
    </g>

    <!-- Five slices (emb, then blocks 1 to 4); the pull pools the middle three. Pooling runs position → slice → batch: each stage's thin connector carries its result to the next stage's line. -->
    <g id="mellowmax-connectors" stroke-linecap="round" stroke="magenta">
      <path d="M163.930 68.396L249.051 117.541" stroke-width="1" />
      <path d="M136.821 84.047L221.942 133.192" stroke-width="1" />
      <path d="M109.713 99.698L194.834 148.843" stroke-width="1" />
      <path d="M109.713 99.698L70 122.5" stroke-width="2" />
    </g>
    <g id="mellowmax-over-positions-outline" stroke-width="8" stroke-linecap="round" style="stroke: var(--cube-fill)">
      <path d="M174.773 74.656L249.051 117.541" />
      <path d="M147.665 90.307L221.942 133.192" />
      <path d="M120.556 105.959L194.834 148.843" />
    </g>
    <g id="mellowmax-over-positions" stroke-width="5" stroke-linecap="round" stroke="magenta">
      <path d="M174.773 74.656L249.051 117.541" />
      <path d="M147.665 90.307L221.942 133.192" />
      <path d="M120.556 105.959L194.834 148.843" />
    </g>
    <g id="mean-connectors" stroke-width="2" stroke-linecap="round" stroke="orange">
      <path d="M69.0067 124L69.0067 143" />
    </g>
    <path id="mean-outline" d="M69 142.8V246.8" stroke-width="8" stroke-linecap="round" style="stroke: var(--cube-fill)" />
    <path id="mean" d="M69 142.8V246.8" stroke-width="5" stroke-linecap="round" stroke="orange" />
    <path
      id="mellowmax-over-slices-outline"
      d="M109.984 99.855L164.201 68.552"
      stroke-width="8"
      stroke-linecap="round"
      style="stroke: var(--cube-fill)"
    />
    <path id="mellowmax-over-slices" d="M109.984 99.855L164.201 68.552" stroke-width="5" stroke-linecap="round" stroke="magenta" />
  </g>

  <!-- Each label lies in the plane of the face beside its edge: the top face for position and slice, the left face for batch. -->
  <g
    id="axis-labels"
    transform="translate(40 0)"
    style="white-space: pre; fill: var(--ink)"
    xml:space="preserve"
    font-family="Inter, sans-serif"
    font-size="15"
    text-anchor="middle"
  >
    <text id="position" transform="matrix(0.866025 0.5 -0.866025 0.5 257.222 52.8494)">
      <tspan x="40.5" y="14.4705">position (p)</tspan>
    </text>
    <text id="slice" transform="matrix(0.866025 -0.5 0.866025 0.5 92.1843 85.6671)">
      <tspan x="27.5" y="14.4705">slice (ℓ)</tspan>
    </text>
    <text id="batch" transform="matrix(0 -1 0.866025 0.5 69 199)">
      <tspan x="0" y="-9">batch</tspan>
    </text>
  </g>

  <!-- One row: swatch, then its label, per item. -->
  <g id="legend" style="white-space: pre" xml:space="preserve" font-family="Inter, sans-serif" font-size="14">
    <rect
      x="50.5"
      y="362.5"
      width="29"
      height="13"
      stroke-width="1"
      style="stroke: var(--ink); fill: var(--label-fill)"
    />
    <text x="90" y="374" style="fill: var(--ink)">labeled sequence</text>
    <path d="M235 369H263" stroke="magenta" stroke-width="5" stroke-linecap="round" />
    <text x="273" y="374" style="fill: var(--ink)">mellowmax</text>
    <path d="M370 369H398" stroke="orange" stroke-width="5" stroke-linecap="round" />
    <text x="408" y="374" style="fill: var(--ink)">mean</text>
  </g>
</svg>
