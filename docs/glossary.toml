# The shared glossary: terms whose meaning holds across reports.
#
# mini.lit annotates the first use of each term in every section of a report with its
# definition: in the margin on a wide screen and in the PDF, on hover on a narrow screen
# (src/mini/lit/notes.py). A report's own `## Glossary` section wins over an entry here,
# so a report that uses a term in a narrower sense says so there.
#
# One table per term, keyed by its name. `definition` is inline Markdown. `aliases`
# (optional) lists other wordings. `auto = false` keeps a term that is also an everyday
# word from being matched on its own; mark a use of it with [text](term:name).

["expected exact match"]
definition = "The task score we measure. With drawn answers the correct answer to a line is spread over two or more colors, so we take the chance that an answer drawn from the model agrees with one drawn from the true distribution. Its ceiling is that same chance for the true distribution against itself (Σq²), below 1 on the ops that round."

[band]
definition = "Our measurement precision. Two seed means are told apart only when they differ by more than 2σ√(1/n_a + 1/n_b), with σ the per-run spread and n the seed counts; smaller differences are reported as unresolved."
auto = false
